<h2 class="text-label-md font-label-md text-on-surface-variant uppercase tracking-wider">Total Debt</h2>
<div class="text-display-lg font-display-lg font-extrabold text-on-background tracking-tight">
                    $24,500<span class="text-on-surface-variant text-headline-md">.00</span>
</div>
<div class="flex items-center gap-2 mt-2">
<span class="material-symbols-outlined text-primary-fixed text-sm">trending_down</span>
<span class="text-label-sm font-label-sm text-primary-fixed">-$450 from last month</span>
</div>
</div>
</section>
