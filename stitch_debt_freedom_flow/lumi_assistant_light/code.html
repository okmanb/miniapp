<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        /* Subtle background glow for 'Good Vibe' */
        .ambient-glow {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 50vh;
            background: radial-gradient(circle, rgba(0,107,88,0.08) 0%, rgba(250,248,255,0) 70%);
            pointer-events: none;
            z-index: 0;
        }

    body {
      min-height: max(884px, 100dvh);

<body class="antialiased min-h-screen relative font-body-md">
<div class="ambient-glow"></div>
<main class="relative z-10 w-full max-w-md mx-auto min-h-screen flex flex-col pb-[100px]">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 border-b border-outline-variant/30 shadow-sm bg-surface/90 backdrop-blur-xl">
<div class="flex items-center justify-between px-margin-main h-16 w-full max-w-md mx-auto">
<div class="flex items-center gap-gap-sm scale-95 active:scale-90 transition-transform duration-200 cursor-pointer">
<img class="w-8 h-8 rounded-full object-cover border border-outline-variant" data-alt="A small circular avatar placeholder image for the user profile, showing a modern, stylized geometric face in dark mode with teal accents, set against a dark background. High-quality digital art style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC2ZqqiF3Tpvhy1HcXX72HS-LlahpkfTbcIkuVOpT65-hkg8pLMjj9eeVNOh0KMQFNlUj5PsePKvbqPufGHI0J6KSQnj6GL8lszord8IqOrFshcQX-alwyHusiLXOikOeOJ89rUFM-mEzNT_FZdTjg5l-43fvD_PLRs45D3UInnlXX84GExBpFlGUc4j7jmJ2L3G_SXtVU3nvm3QhXbYvCSn4Mxf7m42kdNxgcSSccqjbq6tqtBp4n-"/>
</div>
<h1 class="text-headline-md font-headline-md font-bold tracking-tight text-primary">
                    Lumina Finance
                </h1>
<button class="text-primary hover:opacity-80 transition-opacity scale-95 active:scale-90 transition-transform duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">notifications</span>
</button>
</div>
</header>
<!-- Chat Area -->
<section class="flex-1 px-margin-main pt-24 pb-32 flex flex-col gap-gap-lg overflow-y-auto">
<!-- Date Separator -->
<div class="flex justify-center w-full">
<span class="text-label-sm font-label-sm text-on-surface-variant bg-surface-container-high px-3 py-1 rounded-full border border-outline-variant/30">Today, 10:42 AM</span>
</div>
<!-- Assistant Message -->
<div class="flex gap-gap-sm items-start max-w-[90%]">
<div class="w-10 h-10 rounded-full flex-shrink-0 bg-gradient-to-br from-primary-fixed to-secondary-fixed p-[1px] shadow-[0_0_15px_rgba(105,250,215,0.4)]">
<div class="w-full h-full rounded-full bg-surface flex items-center justify-center">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
</div>
<div class="flex flex-col gap-gap-sm">
<div class="text-label-sm font-label-sm text-on-surface-variant ml-1">Lumi</div>
<div class="bg-surface-container/80 backdrop-blur-md border border-outline-variant/30 rounded-2xl rounded-tl-sm p-4 shadow-sm text-body-md font-body-md text-on-surface">
                        Hey Alex, you're <span class="text-primary font-bold">$250</span> away from hitting your monthly goal! Should we schedule a payment for your <span class="text-secondary font-bold">highest APR card</span>?
                    </div>
</div>
</div>
<!-- Action Suggestions (Bento Style) -->
<div class="grid grid-cols-2 gap-gutter pl-[48px]">
<!-- Action 1: Primary Action -->
<button class="col-span-2 relative group overflow-hidden rounded-xl bg-gradient-to-br from-surface-container-high to-surface-container p-[1px] shadow-sm text-left transition-all hover:-translate-y-1">
<div class="absolute inset-0 bg-primary/5 group-hover:bg-primary/10 transition-colors"></div>
<div class="relative h-full w-full bg-surface/90 backdrop-blur-xl rounded-[11px] p-4 flex items-center justify-between border-t border-outline-variant/30">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">event_available</span>
</div>
<div class="flex flex-col">
<span class="text-body-md font-headline-md font-semibold text-on-surface">Schedule Payment</span>
<span class="text-label-sm font-label-sm text-on-surface-variant">Citi Double Cash (-$250)</span>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">arrow_forward</span>
</div>
</button>
<!-- Action 2: Secondary Idea -->
<button class="col-span-1 rounded-xl bg-surface-container border border-outline-variant/30 p-4 flex flex-col gap-2 hover:bg-surface-container-high transition-colors shadow-sm relative overflow-hidden group text-left">
<div class="w-8 h-8 rounded-full bg-secondary-container/30 flex items-center justify-center mb-1">
<span class="material-symbols-outlined text-secondary text-[18px]">account_balance</span>
</div>
<span class="text-label-md font-headline-md font-medium text-on-surface leading-tight">Explore Debt Consolidation</span>
<div class="absolute -bottom-4 -right-4 w-16 h-16 bg-secondary/10 blur-xl rounded-full group-hover:bg-secondary/20 transition-all"></div>
</button>
<!-- Action 3: Quick Action -->
<button class="col-span-1 rounded-xl bg-surface-container border border-outline-variant/30 p-4 flex flex-col gap-2 hover:bg-surface-container-high transition-colors shadow-sm relative overflow-hidden group text-left">
<div class="w-8 h-8 rounded-full bg-tertiary-container/30 flex items-center justify-center mb-1">
<span class="material-symbols-outlined text-tertiary text-[18px]">show_chart</span>
</div>
<span class="text-label-md font-headline-md font-medium text-on-surface leading-tight">View Goal Progress</span>
<div class="absolute -bottom-4 -right-4 w-16 h-16 bg-tertiary/10 blur-xl rounded-full group-hover:bg-tertiary/20 transition-all"></div>
</button>
</div>
</section>
<!-- User Input Area -->
<div class="fixed bottom-[80px] w-full max-w-md mx-auto px-margin-main z-40 bg-gradient-to-t from-background via-background/90 to-transparent pb-4 pt-8">
<div class="relative w-full flex items-center bg-surface rounded-full border border-outline-variant/50 shadow-lg p-1 pr-2 backdrop-blur-md">
<input class="flex-1 bg-transparent border-none text-body-md font-body-md text-on-surface placeholder:text-on-surface-variant focus:ring-0 px-4 h-12" placeholder="Ask Lumi anything..." type="text"/>
<button class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-on-primary hover:bg-primary/90 transition-colors shadow-[0_0_15px_rgba(0,107,88,0.3)] shrink-0">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">arrow_upward</span>
</button>
</div>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-xl bg-surface/90 backdrop-blur-2xl border-t border-outline-variant/30 shadow-[0_-4px_24px_rgba(0,107,88,0.05)] text-primary text-label-sm font-label-sm">
<div class="flex justify-around items-center w-full px-4 pb-6 pt-3 max-w-md mx-auto">
<!-- Home -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-black/5 transition-colors p-2 rounded-xl">
<span class="material-symbols-outlined mb-1">dashboard</span>
<span>Home</span>
</button>
<!-- Debts -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-black/5 transition-colors p-2 rounded-xl">
<span class="material-symbols-outlined mb-1">credit_card</span>
<span>Debts</span>
</button>
<!-- Assistant (ACTIVE) -->
<button class="flex flex-col items-center justify-center text-primary bg-primary/10 rounded-xl px-4 py-1 hover:bg-primary/20 transition-colors scale-95 transition-all duration-200 shadow-sm relative overflow-hidden">
<div class="absolute inset-0 bg-primary/5 animate-pulse rounded-xl"></div>
<span class="material-symbols-outlined mb-1 relative z-10" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<span class="relative z-10 font-bold">Assistant</span>
</button>
<!-- Streaks -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-black/5 transition-colors p-2 rounded-xl">
<span class="material-symbols-outlined mb-1">local_fire_department</span>
<span>Streaks</span>
</button>
</div>
</nav>
</main>
