<!DOCTYPE html>

<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-surface');
        }
        
        .ambient-glow-teal {
            box-shadow: 0 0 15px theme('colors.neon-teal-glow');
        }
        
        .ambient-glow-violet {
            box-shadow: 0 0 15px theme('colors.neon-violet-glow');
        }
        
        .gradient-border-pro {
            position: relative;
        }
        .gradient-border-pro::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: inherit;
            background: linear-gradient(45deg, theme('colors.primary-container'), theme('colors.secondary-container'));
            z-index: -1;
            backdrop-filter: blur(20px);
        }
      </style>
</head>
<body class="bg-background min-h-screen font-body-md text-body-md text-on-background pb-24">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-surface/80 backdrop-blur-xl border-b border-white/10 shadow-sm transition-transform duration-200">
<div class="flex items-center justify-between px-gutter h-16 w-full max-w-md mx-auto">
<div class="flex items-center gap-sm">
<div class="w-8 h-8 rounded-full overflow-hidden border border-surface-container">
<img class="w-full h-full object-cover" data-alt="A close up, high quality profile photo of a young professional in a modern, brightly lit office environment. The lighting is crisp and even, suitable for a high-contrast clean light mode UI. The person has a friendly but focused expression." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBOeYIJwRSmZe8K-zEnnxP0dTZPjhhNhFYvVFYt-8uwwfcXAWkoDMAgzfSSoBr34r9Q7niMfda1XLPH3CWnvNNcVwsK938wJswgoveo0YVV1rofNeJoSPMomImif57osvfPN9vm4EZtBlsegoLHmyDsv3Tc7uCxQNQpRFRaFkVU62IVdruXw--IXZ0RpvLFTeirlokGSgohtv0sQI1I5-5j6WXz0IRKIKyMLcmKni2whDV1fesvmfCa"/>
</div>
</div>
<h1 class="text-headline-md font-headline-md font-bold tracking-tight text-primary-fixed dark:text-primary-fixed-dim">Lumina Finance</h1>
<button class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-90 scale-95 duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">notifications</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-24 px-gutter max-w-md mx-auto flex flex-col gap-lg pb-10">
<!-- Total Debt Card (High Contrast / Gradient) -->
<section class="rounded-xl overflow-hidden shadow-lg relative">
<div class="absolute inset-0 bg-gradient-to-br from-primary-container to-secondary-container opacity-90 z-0"></div>
<div class="relative z-10 p-padding-card flex flex-col gap-sm text-on-primary">
<div class="flex justify-between items-center">
<span class="font-label-md text-label-md text-on-primary/80 uppercase tracking-widest">Total Debt</span>
<span class="material-symbols-outlined text-on-primary/80">info</span>
</div>
<h2 class="font-display-lg text-display-lg mt-unit">$42,850.00</h2>
<div class="flex gap-md mt-margin-main">
<button class="flex-1 bg-surface-container-lowest text-primary-container font-label-md text-label-md py-3 rounded-lg shadow-sm hover:scale-95 transition-transform duration-200 flex justify-center items-center gap-unit">
                        Pay Now
                    </button>
<button class="flex-1 bg-transparent border-2 border-on-primary/30 text-on-primary font-label-md text-label-md py-3 rounded-lg hover:bg-on-primary/10 transition-colors duration-200 flex justify-center items-center gap-unit">
<span class="material-symbols-outlined text-sm">add</span> Add Debt
                    </button>
</div>
</div>
</section>
<!-- Next Due Section -->
<section class="flex flex-col gap-md">
<h3 class="font-headline-md text-headline-md">Next Due</h3>
<div class="flex flex-col gap-sm">
<!-- Due Card 1 -->
<div class="bg-surface-container-lowest border border-surface-container-high rounded-lg p-4 flex justify-between items-center shadow-sm">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">credit_card</span>
</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface">Chase Sapphire</span>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-unit">Due in 3 days</span>
</div>
</div>
<div class="flex flex-col items-end">
<span class="font-body-lg text-body-lg font-bold text-on-surface">$1,250.00</span>
</div>
</div>
<!-- Due Card 2 -->
<div class="bg-surface-container-lowest border border-surface-container-high rounded-lg p-4 flex justify-between items-center shadow-sm">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">account_balance</span>
</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface">Student Loan</span>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-unit">Due in 12 days</span>
</div>
</div>
<div class="flex flex-col items-end">
<span class="font-body-lg text-body-lg font-bold text-on-surface">$450.00</span>
</div>
</div>
</div>
</section>
<!-- Payment Streak Card (Pro/Featured) -->
<section class="gradient-border-pro rounded-xl bg-surface-container-lowest p-padding-card shadow-md flex flex-col gap-md">
<div class="flex justify-between items-center">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-tertiary-container" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<h3 class="font-headline-lg-mobile text-headline-lg-mobile">Payment Streak</h3>
</div>
<span class="font-label-md text-label-md text-tertiary-container bg-tertiary-container/10 px-2 py-1 rounded">Active</span>
</div>
<div class="flex items-end gap-sm mt-unit">
<span class="font-display-lg text-display-lg text-tertiary-container">14</span>
<span class="font-body-md text-body-md text-on-surface-variant mb-2">Months in a row</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant">You're doing great! Keep it up to reduce your interest rate.</p>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-xl bg-surface/90 dark:bg-surface/90 backdrop-blur-2xl border-t border-white/10 shadow-[0_-4px_24px_rgba(0,189,157,0.1)] md:hidden">
<div class="flex justify-around items-center w-full px-4 pb-6 pt-3 max-w-md mx-auto">
<!-- Active: Home -->
<button class="flex flex-col items-center justify-center text-primary-fixed dark:text-primary-fixed-dim bg-primary/10 rounded-xl px-3 py-1 scale-95 transition-all duration-200 hover:bg-white/5">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">dashboard</span>
<span class="text-label-sm font-label-sm mt-1">Home</span>
</button>
<!-- Inactive -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant opacity-60 hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined">credit_card</span>
<span class="text-label-sm font-label-sm mt-1">Debts</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant opacity-60 hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined">auto_awesome</span>
<span class="text-label-sm font-label-sm mt-1">Assistant</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant opacity-60 hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined">local_fire_department</span>
<span class="text-label-sm font-label-sm mt-1">Streaks</span>
</button>
</div>
</nav>
</body></html>
