<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #F1F3EF; font-family: "Work Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #0E3A31; }
    a:hover { color: #175F42; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<!--
  INGRESAR, en la lengua de B.

  La primera version de esta pantalla traia la cabecera oscura de la direccion
  A. Elegida B, eso deja de tener sentido: el argumento entero de B es que la
  app se queda clara, y una pantalla oscura justo despues de la landing rompe
  lo unico que la sostiene. Asi que el marco es el mismo de B — el nombre a
  tamano de display, mas chico que en la landing porque aca no es el titular
  sino la marca de donde estas.

  Los campos NO cambian respecto de lo que ya existe en components/AuthShell:
  alto 44, radio 12, borde #D3DAD2, etiqueta 10.5 en mayusculas con .06em.
  Eso ya esta bien y no hay motivo para tocarlo.
-->
<div style="width: 390px; min-height: 790px; background: #F1F3EF; color: #12211D; overflow: hidden">

  <div style="display: flex; flex-direction: column; padding: 46px 18px 0 18px">

    <a href="#" style="display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: #5C6B65; text-decoration: none; min-height: 44px; margin-top: -12px">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.5 8h-11M7 3.5 2.5 8 7 12.5" stroke="#5C6B65" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Volver</span>
    </a>

    <h1 style="margin: 10px 0 0 0; font-size: 40px; line-height: .96; letter-spacing: -.04em; font-weight: 800; color: #0E3A31">¿Llegás?</h1>

    <div style="display: flex; flex-direction: column; gap: 6px; border-left: 2px solid #97DCBA; padding-left: 14px; margin-top: 20px">
      <span style="font-size: 19px; line-height: 1.25; font-weight: 600; letter-spacing: -.015em; color: #12211D">Ingresar</span>
      <span style="font-size: 12px; line-height: 1.5; color: #5C6B65; text-wrap: pretty">
        Entrás y recuperás tus deudas, tu flujo y tu plan tal como los dejaste.
      </span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 28px">
      <label for="email" style="font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #5C6B65">Email</label>
      <input id="email" type="email" placeholder="vos@ejemplo.com" style="min-height: 44px; width: 100%; box-sizing: border-box; border: 1px solid #D3DAD2; border-radius: 12px; background: #FFFFFF; padding: 0 13px; font-family: inherit; font-size: 15px; color: #12211D; outline: none">
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 18px">
      <label for="clave" style="font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #5C6B65">Clave</label>
      <input id="clave" type="password" value="••••••••••" style="min-height: 44px; width: 100%; box-sizing: border-box; border: 1px solid #D3DAD2; border-radius: 12px; background: #FFFFFF; padding: 0 13px; font-family: inherit; font-size: 15px; color: #12211D; outline: none">
    </div>

    <div style="display: flex; justify-content: flex-end; margin-top: 4px">
      <a href="#" style="min-height: 44px; display: flex; align-items: center; font-size: 12px; color: #0E3A31; text-decoration: underline; text-underline-offset: 2px">Olvidé mi clave</a>
    </div>

    <a href="#" style="display: flex; min-height: 44px; align-items: center; justify-content: center; gap: 7px; border-radius: 999px; background: #0D6B5C; padding: 13px 20px; font-size: 13.5px; font-weight: 600; color: #FFFFFF; margin-top: 4px">
      <span>Ingresar</span>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.5 8h11M9 3.5 13.5 8 9 12.5" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>

    <!-- La salida que hoy no existe: quien llega a /login sin cuenta tiene que
         volver atras con el boton del navegador para poder probar. -->
    <div style="display: flex; align-items: center; gap: 12px; margin-top: 28px">
      <span style="height: 1px; flex-grow: 1; background: #DEE3DD"></span>
      <span class="mono" style="font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; color: #A6B0AA">o</span>
      <span style="height: 1px; flex-grow: 1; background: #DEE3DD"></span>
    </div>

    <a href="#" style="display: flex; min-height: 44px; align-items: center; justify-content: space-between; gap: 8px; border-radius: 999px; border: 1px solid #D3DAD2; background: #FFFFFF; padding: 13px 20px; font-size: 13.5px; font-weight: 600; color: #0E3A31; margin-top: 16px">
      <span>Probar sin cuenta</span>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.5 8h11M9 3.5 13.5 8 9 12.5" stroke="#0E3A31" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>

    <p style="margin: 10px 0 0 0; font-size: 11.5px; line-height: 1.5; color: #5C6B65; text-wrap: pretty">
      Probar no pide cuenta ni datos del banco. Lo que cargues se conserva si después creás una.
    </p>

    <div style="display: flex; justify-content: center; gap: 5px; font-size: 12px; color: #5C6B65; margin-top: 26px">
      <span>¿Todavía no tenés cuenta?</span>
      <a href="#" style="color: #0E3A31; text-decoration: underline; text-underline-offset: 2px">Crear una</a>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
